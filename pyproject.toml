[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crossborder-nexus"
version = "0.1.0"
description = "Portfolio reference implementation of the CrossBorder Nexus multi-agent operations platform"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "langgraph>=0.3,<1",
  "langchain-core>=0.3,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.3,<1",
  "redis>=5,<7",
  "httpx>=0.28,<1",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
]

[project.optional-dependencies]
eval = ["ragas>=0.3,<1", "datasets>=3,<5"]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
