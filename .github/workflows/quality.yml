name: quality

on:
  push:
  pull_request:

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: product-selection/package-lock.json
      - name: Install
        run: pip install ".[dev]"
      - name: Verify repository contracts
        run: python scripts/verify_portfolio.py
      - name: Run tests
        run: pytest -q
      - name: Run evaluation quality gate
        run: python -m evaluation.run_all
      - name: Install product-selection dependencies
        working-directory: product-selection
        run: npm ci
      - name: Test product-selection workbench
        working-directory: product-selection
        run: npm test
      - name: Type-check product-selection workbench
        working-directory: product-selection
        run: npm run typecheck
      - name: Build product-selection workbench
        working-directory: product-selection
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-report
          path: evaluation/reports/latest_report.json
