services:
  api:
    build: .
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace
    depends_on:
      - postgres
      - redis

  product-selection:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    ports:
      - "5273:5273"
    volumes:
      - ./product-selection:/app
      - product_selection_node_modules:/app/node_modules

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: crossborder
      POSTGRES_USER: crossborder
      POSTGRES_PASSWORD: crossborder
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  product_selection_node_modules:
